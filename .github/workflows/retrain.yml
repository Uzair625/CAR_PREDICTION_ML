name: Scrape-Train-Deploy

on:
  schedule:
    - cron: '0 2 * * 0'   # Every Sunday 2am UTC

  workflow_dispatch:
    inputs:
      pages:
        description: 'Pages to scrape per site'
        required: false
        default: '5'

permissions:
  contents: write

jobs:
  scrape-train-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Expose secrets as env vars so they can be checked in if: conditions
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      PAGES: ${{ github.event.inputs.pages || '5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Kaggle credentials
        if: env.KAGGLE_USERNAME != ''
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${KAGGLE_USERNAME}\",\"key\":\"${KAGGLE_KEY}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Scrape Craigslist (USA)
        run: |
          python - <<'PYEOF'
          import os
          os.makedirs('data/raw', exist_ok=True)
          from data_collection.scraper_craigslist import CraigslistScraper
          df = CraigslistScraper().scrape(pages=int(os.environ.get('PAGES', '5')))
          if not df.empty:
              df.to_csv('data/raw/craigslist_usa.csv', index=False)
              print(f'Craigslist: {len(df)} rows saved')
          PYEOF
        continue-on-error: true

      - name: Scrape AutoScout24 (Europe)
        run: |
          python - <<'PYEOF'
          import os
          os.makedirs('data/raw', exist_ok=True)
          from data_collection.scraper_autoscout24 import AutoScout24Scraper
          df = AutoScout24Scraper().scrape(pages=int(os.environ.get('PAGES', '5')))
          if not df.empty:
              df.to_csv('data/raw/autoscout24_europe.csv', index=False)
              print(f'AutoScout24: {len(df)} rows saved')
          PYEOF
        continue-on-error: true

      - name: Scrape OLX (Multi-country)
        run: |
          python - <<'PYEOF'
          import os
          os.makedirs('data/raw', exist_ok=True)
          from data_collection.scraper_olx import OLXScraper
          df = OLXScraper().scrape(pages=int(os.environ.get('PAGES', '3')))
          if not df.empty:
              df.to_csv('data/raw/olx_multicountry.csv', index=False)
              print(f'OLX: {len(df)} rows saved')
          PYEOF
        continue-on-error: true

      - name: Download Kaggle datasets
        if: env.KAGGLE_USERNAME != ''
        run: python -m data_collection.kaggle_downloader
        continue-on-error: true

      - name: Merge and standardize all data
        run: |
          python - <<'PYEOF'
          from data_collection.standardize import merge_and_save
          df = merge_and_save()
          if df is not None and not df.empty:
              print(f'Global dataset: {len(df)} rows')
              print(df['country'].value_counts().to_string())
          PYEOF

      - name: Retrain model
        run: python train_model.py

      - name: Commit and push updated model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model.pkl model_results.pkl || true
          git add data/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-retrain $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push origin main
            echo "Pushed — Streamlit Cloud will auto-redeploy"
          fi
